openapi: 3.0.3
info:
  title: OrcaSlicer Remote API
  version: "1.0"
  description: |
    Token-authenticated HTTP + WebSocket API embedded in OrcaSlicer, exposing the
    running application for automation (status, live config read/write, slicing,
    and an event stream).

    **Enabling:** Preferences → *Remote API*: enable, choose LAN vs localhost,
    port (default 13130), and copy/regenerate the token. Off by default.

    **Auth:** every HTTP request must send `X-Api-Token: <token>`. The WebSocket
    endpoint authenticates via a `?token=<token>` query parameter (browser WS
    clients cannot set request headers).

    **Threading note:** the server runs a single I/O thread and dispatches most
    endpoints onto the GUI thread with a 10s timeout (`504 ui_timeout`). Treat the
    API as single-client; concurrent heavy calls serialize.
servers:
  - url: http://{host}:{port}/api/v1
    variables:
      host: { default: "127.0.0.1", description: "localhost, or the machine's LAN IP when 'Bind LAN' is on" }
      port: { default: "13130" }
security:
  - ApiToken: []
paths:
  /status:
    get:
      summary: Application + project status
      operationId: getStatus
      responses:
        "200":
          description: Current app, project, loaded objects, selected/modified presets, and slice validity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /config:
    get:
      summary: Read the merged (full) config
      operationId: getConfig
      description: |
        Returns the secure merged config (secrets redacted) as canonical string
        values (same form as `.ini`/`.3mf`). Optionally filter with `?keys=`.
      parameters:
        - name: keys
          in: query
          required: false
          schema: { type: string }
          description: Comma-separated key list, e.g. `layer_height,wall_loops`.
          example: layer_height,wall_loops
      responses:
        "200":
          description: Config map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    additionalProperties: { type: string }
                    example: { layer_height: "0.2", wall_loops: "2" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Apply config changes (live)
      operationId: putConfig
      description: |
        Applies key/value edits through the GUI's own edit path (dirty markers +
        live panel refresh + slice invalidation), exactly as if typed in the UI.

        **Atomic:** if ANY key is unknown or fails validation, NOTHING is applied
        and the response is `422` with per-key reasons. On full success the
        response is `200` with every applied key.

        Values may be JSON strings, numbers, or booleans; they are coerced to the
        canonical config string form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: { layer_height: 0.28, wall_loops: 3 }
      responses:
        "200":
          description: All keys applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigApplyResult" }
              example: { applied: ["layer_height", "wall_loops"], errors: {} }
        "422":
          description: At least one key invalid — nothing applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigApplyResult" }
              example: { applied: [], errors: { layer_height: "value out of range", bogus_key: "unknown_key" } }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                not_object: { value: { error: "body_must_be_object" } }
                bad_json:   { value: { error: "invalid_json" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /slice:
    post:
      summary: Start slicing the current plate
      operationId: startSlice
      description: |
        Triggers a reslice of the current plate. Progress and completion are
        delivered as `slice.*` WebSocket events and via `GET /slice/status`.
      responses:
        "202":
          description: Slicing started.
          content:
            application/json:
              schema: { type: object, properties: { started: { type: boolean, enum: [true] } } }
              example: { started: true }
        "200":
          description: Plate already sliced (valid result) — nothing to do.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean, enum: [false] }
                  already_valid: { type: boolean, enum: [true] }
              example: { started: false, already_valid: true }
        "409":
          description: A slice is already in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "already_slicing" }
        "422":
          description: Nothing to slice (no objects on the plate).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "nothing_to_slice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /slice/status:
    get:
      summary: Current/last slice state
      operationId: getSliceStatus
      responses:
        "200":
          description: Slice state snapshot. `stats` present once done; `warnings` always present (may be empty).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SliceStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events:
    get:
      summary: WebSocket event stream (upgrade)
      operationId: events
      description: |
        **This is a WebSocket endpoint, not a normal GET.** Open a WebSocket to
        `ws://{host}:{port}/api/v1/events?token=<token>`. A bad/missing token
        closes the connection immediately. Inbound messages are ignored.

        Each message is a JSON object with an `event` field. See the
        `Event` schema for the payload shapes:
        `slice.started`, `slice.progress`, `slice.done`, `slice.error`,
        `slice.cancelled`, `slice.plate_changed`, `config.changed`, `project.opened`.

        Note: `slice.*` event payloads carry `stats` (on done) but NOT the slice
        `warnings` array — fetch `GET /slice/status` for warnings.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101": { description: Switching Protocols (WebSocket handshake accepted). }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /plates:
    get:
      summary: List the plates
      operationId: getPlates
      description: |
        Every plate in the project with its index (0-based), name, whether it is the
        current one (the plate `slice`, `gcode`, `plate/render` and `jobs/status`
        act on), lock state, build volume and the objects it holds. Also reports
        `max` (the plate limit) and whether a plate can be added or deleted now.
      responses:
        "200":
          description: Plate list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlateList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
    post:
      summary: Add a plate
      operationId: createPlate
      description: |
        Same steps as the toolbar's "Add plate": a new empty plate is appended and,
        unless `select` is false, becomes the current plate.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                select: { type: boolean, default: true, description: "Make the new plate current." }
      responses:
        "200":
          description: Plate created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: boolean, enum: [true] }
                  index: { type: integer, description: "0-based index of the new plate." }
                  count: { type: integer }
                  current: { type: integer }
                  plate: { $ref: "#/components/schemas/Plate" }
        "409":
          description: A slice is running; plates cannot be added until it ends.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The plate limit is reached (`max` says what it is).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "max_plates", max: 36 }
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /plates/{index}:
    delete:
      summary: Delete a plate
      operationId: deletePlate
      x-destructive: true
      description: |
        Removes plate `index`. The objects it held are not deleted: they are parked
        beside the bed, as the toolbar's delete does, and `objects_moved_off_plate`
        reports how many. Later plates shift down one index.
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Plate deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, enum: [true] }
                  index: { type: integer }
                  count: { type: integer }
                  current: { type: integer }
                  objects_moved_off_plate: { type: integer }
        "404":
          description: No plate with that index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_plate", count: 2 }
        "409":
          description: A slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The only plate cannot be deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "last_plate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /plates/{index}/select:
    post:
      summary: Make a plate the current one
      operationId: selectPlate
      description: |
        Equivalent to clicking the plate: `slice`, `gcode`, `plate/render` and
        `jobs/status` then act on it. Selecting the current plate again is a no-op.
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Plate selected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  selected: { type: boolean, enum: [true] }
                  current: { type: integer }
                  plate: { $ref: "#/components/schemas/Plate" }
        "404":
          description: No plate with that index.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "unknown_plate", count: 2 }
        "409":
          description: A slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The slicer refused the switch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "select_failed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /objects/{id}/plate:
    post:
      summary: Move an object onto a plate
      operationId: setObjectPlate
      description: |
        Moves one instance of the object (default instance 0) onto plate `plate`.
        From another plate it keeps its position relative to that plate; from
        off-plate it lands at the target plate's centre. The move takes an undo
        snapshot and refreshes the object list and background process like a drag.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Object id as reported by GET /objects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plate]
              properties:
                plate: { type: integer, minimum: 0, description: "0-based plate index from GET /plates." }
                instance: { type: integer, minimum: 0, default: 0 }
            example: { plate: 1 }
      responses:
        "200":
          description: Moved (or already there, with `moved` false and `already_on_plate` true).
          content:
            application/json:
              schema:
                type: object
                properties:
                  moved: { type: boolean }
                  already_on_plate: { type: boolean }
                  id: { type: integer }
                  instance: { type: integer }
                  plate: { type: integer }
                  from_plate: { type: integer, description: "-1 when it was off every plate." }
                  offset: { $ref: "#/components/schemas/Vec3" }
              example: { moved: true, id: 832, instance: 0, plate: 1, from_plate: 0, offset: [409, 128, 6] }
        "400":
          description: Missing or malformed `plate` / `instance`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "missing_plate" }
        "404":
          description: Unknown object, instance or plate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                object:   { value: { error: "unknown_object" } }
                plate:    { value: { error: "unknown_plate", count: 2 } }
                instance: { value: { error: "unknown_instance", instances: 1 } }
        "409":
          description: A slice is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "slicing" }
        "422":
          description: The plate is locked, or the slicer refused the move.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                locked: { value: { error: "plate_locked" } }
                failed: { value: { error: "move_failed" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
  /slice/cancel:
    post:
      summary: Cancel the slice in progress
      operationId: cancelSlice
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /model:
    post:
      summary: Load a model/project file into the plate
      operationId: loadModel
      description: Loads a 3MF/STL/STEP/OBJ from a path on the machine running OrcaSlicer.
      x-mutating: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: "Absolute path on the OrcaSlicer host." }
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /objects:
    get:
      summary: List objects on the plate with transform, size, per-object config, layer-height ranges
      operationId: getObjects
      description: Each object carries `transform` (instance 0) and `instances_detail`, an array of {index, offset (mm), rotation (radians), rotation_deg (degrees, same angles), scale} with one entry per instance. `transform.rotation_deg` is likewise added beside `transform.rotation`.
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /objects/{id}:
    get:
      summary: One object with its volumes (parts, modifiers, support blockers/enforcers)
      operationId: getObject
      description: Returns the object's id, index, name and config plus `volumes`, an array of {index, id, name, type (part, negative, modifier, support_blocker, support_enforcer), extruder, config}. Volume indices are re-sorted by the slicer after a modifier is added or a volume deleted, so re-read before addressing a volume.
      parameters: [ { $ref: "#/components/parameters/ObjectId" } ]
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "404": { $ref: "#/components/responses/Json" }
    delete:
      summary: Delete an object
      operationId: deleteObject
      x-mutating: true
      x-destructive: true
      parameters: [ { $ref: "#/components/parameters/ObjectId" } ]
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /objects/{id}/transform:
    post:
      summary: Move, rotate and/or scale an object
      operationId: transformObject
      description: |
        Provide at least one of translate, rotate or scale, each as [x,y,z] (exactly three finite numbers, else 400 bad_transform; none of them, 400 no_transform).
        Applied to one instance (`instance`, default 0).
        translate is RELATIVE: millimetres added to the instance offset (world frame), limit +-10000 per component.
        rotate is RELATIVE: degrees added per component to the instance's stored Euler XYZ angles, limit +-3600 per component. With more than one non-zero axis this is not the same as an extra rotation about the world axes, and the angles are not normalised, so they can exceed 360 degrees.
        scale is ABSOLUTE: the per-axis factor is set, not multiplied (sending [2,2,2] twice leaves 2), range 0.0001..1000; negative values are refused, so mirroring is impossible.
        The three act on separate parts of the instance transform, so their order in one request does not matter. Rotation and scale act about the instance origin (the mesh origin), not the bounding-box centre.
        After the change the object is re-dropped onto the bed if it was floating or touching (its lowest point at or above -0.001 mm) or lay wholly below it; one sunk part-way into the bed stays where it is. Check `bbox_min[2]` in GET /objects.
        The response `transform` reports the instance after the change: offset in mm, rotation in RADIANS, rotation_deg in degrees (same angles), scale as factors.
        Any failure to find the target returns 404: unknown_object, no_instance or unknown_instance.
      x-mutating: true
      parameters: [ { $ref: "#/components/parameters/ObjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                translate: { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
                rotate:    { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
                scale:     { type: array, items: { type: number }, minItems: 3, maxItems: 3 }
                instance:  { type: integer, minimum: 0, default: 0, description: "0-based instance to transform; an index past the last instance returns unknown_instance." }
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "404":
          description: Unknown object or instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                object:   { value: { error: "unknown_object" } }
                instance: { value: { error: "unknown_instance", instances: 1 } }
  /objects/{id}/duplicate:
    post:
      summary: Add another instance of an object
      operationId: duplicateObject
      x-mutating: true
      parameters: [ { $ref: "#/components/parameters/ObjectId" } ]
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /objects/{id}/config:
    put:
      summary: Set per-object setting overrides (atomic)
      operationId: putObjectConfig
      description: Body maps print-setting keys to values, e.g. {"wall_loops":4,"sparse_infill_density":"30%"}. Nothing is applied if any key is invalid.
      x-mutating: true
      parameters: [ { $ref: "#/components/parameters/ObjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "422": { $ref: "#/components/responses/Json" }
  /objects/{id}/volumes/{v}/config:
    put:
      summary: Set per-volume (per-part or per-modifier) setting overrides (atomic)
      operationId: putObjectVolumeConfig
      description: Same rules as putObjectConfig (forbidden keys refused, policy-gated keys refused, nothing applied if any key is invalid) but for one volume of the object. `v` is the 0-based volume index from getObject.
      x-mutating: true
      parameters: [ { $ref: "#/components/parameters/ObjectId" }, { $ref: "#/components/parameters/VolumeIndex" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "400":
          description: Body is not an object, or `v` is not a non-negative integer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                index: { value: { error: "bad_volume_index" } }
        "404":
          description: Unknown object or volume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                object: { value: { error: "unknown_object" } }
                volume: { value: { error: "unknown_volume", volumes: 2 } }
        "422": { $ref: "#/components/responses/Json" }
  /objects/{id}/volumes/{v}:
    delete:
      summary: Delete a modifier, support blocker/enforcer or negative volume (never a part)
      operationId: deleteObjectVolume
      description: Parts cannot be deleted through the API (422 cannot_delete_part), so the last part is safe by construction. A negative volume of a cut object is refused (422 cut_object). Indices of the remaining volumes may shift; re-read getObject. When one volume is left the slicer folds its overrides into the object config, as the GUI does.
      x-mutating: true
      x-destructive: true
      parameters: [ { $ref: "#/components/parameters/ObjectId" }, { $ref: "#/components/parameters/VolumeIndex" } ]
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "400": { $ref: "#/components/responses/Json" }
        "404": { $ref: "#/components/responses/Json" }
        "422": { $ref: "#/components/responses/Json" }
  /objects/{id}/modifiers:
    post:
      summary: Add a box or cylinder modifier volume to an object
      operationId: addObjectModifier
      description: "`shape` box takes size [x,y,z] mm; cylinder takes size [diameter,height] mm. `offset` [x,y,z] mm is relative to the centre of the object's bounding box along the bed axes (default [0,0,0]). `type` defaults to modifier. Optional `config` is validated like putObjectVolumeConfig before anything is added. The new volume is not selected. Returns the new volume record at its post-sort index."
      x-mutating: true
      parameters: [ { $ref: "#/components/parameters/ObjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shape, size]
              properties:
                shape:  { type: string, enum: [box, cylinder] }
                size:   { type: array, items: { type: number, minimum: 0.1, maximum: 1000 }, minItems: 2, maxItems: 3 }
                offset: { type: array, items: { type: number, minimum: -10000, maximum: 10000 }, minItems: 3, maxItems: 3 }
                type:   { type: string, enum: [modifier, support_blocker, support_enforcer], default: modifier }
                config: { type: object, additionalProperties: true, description: "Initial setting overrides for the new volume." }
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "400":
          description: Missing or out-of-range shape, size, offset or type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                size: { value: { error: "bad_modifier" } }
        "404": { $ref: "#/components/responses/Json" }
        "422": { $ref: "#/components/responses/Json" }
  /objects/{id}/layer_height:
    put:
      summary: Adaptive layer height for an object, or reset it
      operationId: putObjectLayerHeight
      x-mutating: true
      parameters: [ { $ref: "#/components/parameters/ObjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:    { type: string, enum: [adaptive, reset] }
                quality: { type: number, minimum: 0, maximum: 1, description: "Adaptive quality, 0 = speed, 1 = quality. Default 0.5." }
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /objects/{id}/height_range:
    put:
      summary: Add/update a layer-height range modifier, or clear them all
      operationId: putObjectHeightRange
      x-mutating: true
      parameters: [ { $ref: "#/components/parameters/ObjectId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clear:        { type: boolean, description: "Remove all height ranges." }
                min_z:        { type: number }
                max_z:        { type: number }
                layer_height: { type: number }
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /arrange:
    post:
      summary: Auto-arrange objects on the plate
      operationId: arrange
      description: Optional body fields set the arrange settings the window's arrange menu edits, for the current print-sequence mode, before arranging. Omitted fields keep their current value.
      x-mutating: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                spacing: { type: number, minimum: 0, maximum: 100, description: "Minimum distance between objects in mm; 0 means auto. print_sequence by object needs more than the nozzle clearance." }
                rotate:  { type: boolean, description: "Allow auto rotation while arranging." }
            example: { spacing: 40, rotate: false }
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "400":
          description: Spacing outside 0 to 100, or a field of the wrong type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "spacing_out_of_range" }
        "409": { $ref: "#/components/responses/Json" }
  /orient:
    post:
      summary: Auto-orient objects for printing
      operationId: orient
      x-mutating: true
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "409": { $ref: "#/components/responses/Json" }
  /jobs/status:
    get:
      summary: Whether the background job worker (arrange/orient) is idle
      operationId: getJobsStatus
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /presets:
    get:
      summary: List available print, filament and printer presets
      operationId: getPresets
      parameters:
        - { name: type,    in: query, schema: { type: string, enum: [print, filament, printer] }, description: "Return only this collection." }
        - { name: visible, in: query, schema: { type: integer, enum: [0, 1] }, description: "1 = only presets shown in the GUI. Use both filters: the full list is ~50 KB." }
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /preset:
    put:
      summary: Select a preset
      operationId: selectPreset
      x-mutating: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/PresetRef" }
                - type: object
                  properties:
                    discard:
                      type: boolean
                      default: false
                      description: Drop unsaved edits in EVERY settings group (not just the named type) before selecting. Without it, unsaved edits make the call fail with 409 unsaved_changes naming the dirty groups.
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "400": { description: "bad_discard (discard is not a boolean) or another bad field" }
        "409": { description: "unsaved_changes; the body's dirty array names the modified groups" }
    delete:
      summary: Delete a user preset
      operationId: deletePreset
      x-mutating: true
      x-destructive: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresetRef" }
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /preset/discard:
    post:
      summary: Drop a collection's unsaved edits
      description: Reverts the collection to its saved preset through the tab's own "back to saved values" path (no dialog) and refreshes the tab and sidebar. Responds {type, preset, discarded, dropped_keys}; discarded is false and dropped_keys empty when nothing was modified. Printer discards can change the number of filament slots, as in the GUI.
      operationId: discardPreset
      x-mutating: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [print, filament, printer] }
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "400": { description: "missing_fields, unknown_type or invalid_json" }
        "409": { description: "filament_editor_open: the sidebar filament editor is open, close it first" }
        "500": { description: "tab_unavailable or discard_failed" }
  /preset/save:
    post:
      summary: Save the current edits as a user preset
      operationId: savePreset
      x-mutating: true
      x-destructive: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/PresetRef" }
                - type: object
                  properties:
                    detach: { type: boolean, default: false }
      description: For type=filament the 200 body also carries previous_preset (the edited preset's name before the save), repointed_slots (0-based slots whose preset changed) and slots_using_saved_preset (every slot on the saved name afterwards). A save-as moves exactly the slots that used the old name to the new one; saving under the same name moves none. Saving over a different existing user preset changes the settings of any slot already using that name.
      responses:
        "200": { $ref: "#/components/responses/Json" }
        "500": { description: "slot_repoint_unexpected: a slot moved to a name other than the saved one; the body lists the slots" }
  /preset/config:
    post:
      summary: Read the full config of a named preset
      operationId: getPresetConfig
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresetRef" }
      responses:
        "200": { $ref: "#/components/responses/Json" }
  /gcode:
    get:
      summary: Raw G-code of the last successful slice
      operationId: getGcode
      description: Large. Prefer getSliceStatus (stats + per-role breakdown) unless the actual G-code is needed.
      responses:
        "200":
          description: G-code text.
          content:
            text/plain: { schema: { type: string } }
        "409": { $ref: "#/components/responses/Json" }
  /plate/render:
    get:
      summary: Render the plate or the sliced toolpaths as a PNG
      operationId: renderPlate
      description: Returns an image the model can look at, to check orientation, supports, colour layout and toolpaths.
      parameters:
        - { name: view,   in: query, schema: { type: string, enum: [editor, preview], default: editor } }
        - { name: angle,  in: query, schema: { type: string, enum: [iso, top, front, left, right, rear, bottom], default: iso } }
        - { name: frame,  in: query, schema: { type: string, enum: [plate, object] }, description: "Defaults to plate for editor, object for preview." }
        - { name: width,  in: query, schema: { type: integer, minimum: 64, maximum: 2048, default: 800 } }
        - { name: height, in: query, schema: { type: integer, minimum: 64, maximum: 2048, default: 600 } }
      responses:
        "200":
          description: PNG image.
          content:
            image/png: { schema: { type: string, format: binary } }
components:
  parameters:
    VolumeIndex: { name: v, in: path, required: true, schema: { type: integer, minimum: 0 }, description: "0-based volume index from getObject; re-read after adding or deleting a volume." }
    ObjectId: { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: "Object id from getObjects." }
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-Api-Token
  responses:
    Json:
      description: JSON result; on failure an object with an "error" field.
      content:
        application/json: { schema: { type: object, additionalProperties: true } }
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "unauthorized" }
    UiTimeout:
      description: The GUI thread did not respond within 10s.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "ui_timeout" }
  schemas:
    PresetRef:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [print, filament, printer] }
        name: { type: string }
        extruder: { type: integer, minimum: 0, default: 0, description: "selectPreset only, type=filament: the filament slot (0-based) to set. A multi-tool printer has one preset per slot." }
    Error:
      type: object
      properties:
        error: { type: string }
        detail: { type: string, description: "Present on 500 responses." }
      required: [error]
    Vec3:
      type: array
      items: { type: number }
      minItems: 3
      maxItems: 3
    Status:
      type: object
      properties:
        app: { type: string, example: OrcaSlicer }
        app_version: { type: string, example: "2.3.2" }
        api_version: { type: string, example: "1.0" }
        capabilities:
          type: array
          items: { type: string }
          example: [status, config, slice, events, plates]
        spoolman:
          type: array
          description: Read-only. Spoolman spools that the last filament sync of each Moonraker printer joined to its RFID slots (by card UID, through the printer's own Moonraker Spoolman proxy). Empty when Spoolman is not connected or nothing matched. Spoolman's tool settings use spoolman_* names and are never applied to any preset.
          items:
            type: object
            properties:
              dev_id: { type: string }
              slots:
                type: array
                items:
                  type: object
                  properties:
                    slot: { type: integer, description: "0-based filament slot" }
                    spool_id: { type: integer }
                    name: { type: string }
                    material: { type: string }
                    vendor: { type: string }
                    color: { type: string, description: "RRGGBB, no #" }
                    remaining_weight_g: { type: number, nullable: true }
                    used_weight_g: { type: number, nullable: true }
                    initial_weight_g: { type: number, nullable: true }
                    spoolman_nozzle_temp: { type: integer, description: "0 = unknown" }
                    spoolman_bed_temp: { type: integer, description: "0 = unknown" }
                    spoolman_density: { type: number, description: "g/cm3, 0 = unknown" }
                    spoolman_diameter: { type: number, description: "mm, 0 = unknown" }
        plates:
          type: object
          description: How many plates the project has and which one is current.
          properties:
            count: { type: integer }
            current: { type: integer }
        project: { type: string, description: "Current project filename (may be empty)." }
        objects:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              size_mm: { $ref: "#/components/schemas/Vec3" }
        presets:
          type: object
          properties:
            printer: { type: string }
            print: { type: string }
            filaments: { type: array, items: { type: string } }
        modified:
          type: object
          description: Dirty (unsaved) option keys per preset category.
          properties:
            print: { type: array, items: { type: string } }
            filament: { type: array, items: { type: string } }
            printer: { type: array, items: { type: string } }
        slice_result_valid: { type: boolean }
        slicing: { type: boolean, description: "True while a slice is in progress." }
    Plate:
      type: object
      properties:
        index: { type: integer, description: "0-based; shifts down when an earlier plate is deleted." }
        name: { type: string }
        current: { type: boolean, description: "The plate slice/gcode/render act on." }
        locked: { type: boolean }
        empty: { type: boolean }
        slice_result_valid: { type: boolean }
        origin: { $ref: "#/components/schemas/Vec3" }
        bbox_min: { $ref: "#/components/schemas/Vec3" }
        bbox_max: { $ref: "#/components/schemas/Vec3" }
        objects:
          type: array
          description: Instances the plate holds, from the plate's own bookkeeping.
          items:
            type: object
            properties:
              id: { type: integer }
              instance: { type: integer }
              name: { type: string }
    PlateList:
      type: object
      properties:
        plates:
          type: array
          items: { $ref: "#/components/schemas/Plate" }
        count: { type: integer }
        current: { type: integer }
        max: { type: integer, description: "Plate limit of this build." }
        can_add: { type: boolean }
        can_delete: { type: boolean }
    ConfigApplyResult:
      type: object
      properties:
        applied: { type: array, items: { type: string } }
        errors:
          type: object
          additionalProperties: { type: string }
          description: "key -> reason (e.g. unknown_key, or a validation message)."
      required: [applied, errors]
    SliceStats:
      type: object
      properties:
        estimated_time: { type: string, example: "27m 23s" }
        estimated_time_seconds: { type: number, example: 1643 }
        filament_used_mm: { type: number, example: 1582 }
        filament_used_g: { type: number, example: 4.72 }
        total_cost: { type: number, example: 0.094 }
    SliceWarning:
      type: object
      properties:
        level: { type: integer }
        message: { type: string }
        code: { type: string, example: "1000C001" }
    SliceStatus:
      type: object
      properties:
        state: { type: string, enum: [idle, slicing, done, error] }
        percent: { type: integer, description: "-1 when not slicing." }
        message: { type: string }
        stats: { $ref: "#/components/schemas/SliceStats" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/SliceWarning" }
      required: [state, percent, message, warnings]
    Event:
      type: object
      description: |
        A WebSocket message. `event` discriminates the shape.
      properties:
        event:
          type: string
          enum: [slice.started, slice.progress, slice.done, slice.error, slice.cancelled, slice.plate_changed, config.changed, project.opened]
        state: { type: string, description: "slice.* events: idle|slicing|done|error." }
        percent: { type: integer, description: "slice.* events." }
        message: { type: string, description: "slice.* events." }
        stats: { $ref: "#/components/schemas/SliceStats" }
        tabs:
          type: array
          description: "config.changed: which preset categories changed."
          items: { type: string, enum: [print, filament, printer, sla_print, sla_material, other] }
        project: { type: string, description: "project.opened: the opened project filename." }
      required: [event]
